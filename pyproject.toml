[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "afip-filler"
version = "0.1.0"
description = "Automation scripts for filling AFIP online invoice forms."
readme = "README.md"
requires-python = ">=3.13.5,<3.14"
authors = [{ name = "Hudro" }]
dependencies = [
    "python-dotenv>=1.2.1",
    "selenium>=4.38.0",
    "webdriver-manager>=4.0.2",
]

[project.optional-dependencies]
dev = [
    "black>=24.10.0",
    "ruff>=0.14.5",
    "isort>=6.0.1",
]

[tool.ruff]
line-length = 120
target-version = "py313"
select = ["E", "F", "I"]
extend-select = ["I"]
src = ["app"]

[tool.black]
line-length = 120
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 120
lines_after_imports = 2
sections = ["STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
force_sort_within_sections = true
combine_as_imports = false
default_section = "THIRDPARTY"
